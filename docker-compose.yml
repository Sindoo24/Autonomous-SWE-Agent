# Development services for Phases 5-8. The API, worker and UI run on the host (WSL) from the
# project's virtualenv: the worker drives Docker sandboxes with host paths, which is simplest
# when it is not itself in a container. Containerising api / worker / ui is Phase 9.
#
#   docker compose up -d postgres                 # required for api / worker / experiments
#   docker compose --profile jaeger up -d         # optional trace viewer (SWE_OTEL_EXPORTER=otlp)
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: swe
      POSTGRES_PASSWORD: swe
      POSTGRES_DB: swe_agent
    ports:
      - "127.0.0.1:5432:5432"   # localhost only
    volumes:
      - swe-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swe -d swe_agent"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  jaeger:
    profiles: ["jaeger"]
    image: jaegertracing/all-in-one:1.62.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "127.0.0.1:16686:16686"  # UI
      - "127.0.0.1:4318:4318"    # OTLP/HTTP

volumes:
  swe-pgdata:
