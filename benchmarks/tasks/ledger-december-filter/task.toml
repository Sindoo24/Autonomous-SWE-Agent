issue = """`--month` finds nothing for December.

    2024-11-28 groceries -50.00 #food
    2024-12-24 gifts -300.00 #gifts
    2024-12-31 party -45.00 #fun

    $ python -m ledger_cli 2024.ledger balance --month 2024-12
