    -------  -------
    total      $0.00

Expected the checking account with -$345.00 and a total of -$345.00. `--month 2024-11` and every
other month work; only December comes back empty (same for `categories --month 2024-12`,
`register --month 2024-12`, ...)."""
expected_behavior = "Month filtering covers the full calendar month for every month including December (Dec 1 to Dec 31 inclusive); month_bounds returns the correct first/last day."
