[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "swe-agent"
version = "0.8.0"
description = "Autonomous software-engineering agent: repository understanding, bug diagnosis, verified patch generation."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    # orchestration: explicit state graph, conditional edges, checkpoints, interrupts
    "langgraph>=1.0,<2",
    # durable checkpoints for CLI runs without a database (the API/worker use Postgres)
    "langgraph-checkpoint-sqlite>=3.0,<4",
    "aiosqlite>=0.20",
    # typed schemas for state, tool I/O, API
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    # model provider HTTP calls (Ollama / OpenAI-compatible)
    "httpx>=0.27,<1",
    # structured JSON logging
    "structlog>=24.1",
    # fault-tolerant code parsing for the symbol index
    "tree-sitter>=0.23",
    "tree-sitter-python>=0.23",
    # parse dependency specifiers from repo manifests without executing anything
    "packaging>=23",
    # PostgreSQL (one driver, psycopg 3, for SQLAlchemy and LangGraph), API, worker
    "sqlalchemy[asyncio]>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "langgraph-checkpoint-postgres>=3.0,<4",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    # tracing spans (exported to JSONL by default; OTLP exporter is optional)
    "opentelemetry-sdk>=1.25",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.5",
    "mypy>=1.10",
    "pytest-cov>=5",
]

# web UI (Streamlit, talks to the API only) and the optional report chart
ui = ["streamlit>=1.40,<2"]
charts = ["matplotlib>=3.8"]
otlp = ["opentelemetry-exporter-otlp-proto-http>=1.25"]

[project.scripts]
swe-agent = "swe_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["swe_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# "." for tests.* imports; ".." so the UI tests can import the frontend package
pythonpath = [".", ".."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "live_model: requires a running model endpoint (skipped unless SWE_LIVE_MODEL=1)",
    "docker: requires a reachable Docker daemon (skipped otherwise)",
    "postgres: requires PostgreSQL at SWE_TEST_DATABASE_URL (skipped otherwise)",
]
# schema classes named Test* (TestRun, TestRunStatus) are not test classes
filterwarnings = ["ignore::pytest.PytestCollectionWarning"]
# fixture repos contain their own tests; never collect them
norecursedirs = ["tests/fixtures", ".git", ".venv"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "ASYNC"]
ignore = [
    "S101",  # assert is fine in tests
    "S603",  # subprocess without shell: we always pass argv lists deliberately
    "RUF001", "RUF002", "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B011", "E501"]
# /tmp here is a path *inside* the container (tmpfs), not a host temp file;
# the permissive modes apply to a disposable snapshot copy mounted into the sandbox.
"swe_agent/sandbox/**" = ["S108", "S103"]
# SQL views are long literal SQL; autogenerated Alembic code keeps its layout.
"swe_agent/db/migrations/**" = ["E501", "W291"]
# the f-strings only splice constant ORDER BY clauses; every value is a bound parameter
"swe_agent/evaluation/metrics.py" = ["S608"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["swe_agent"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["tree_sitter_python"]
ignore_missing_imports = true
